[extend]
useDefault = true

[[allowlists]]
description = "Elasticsearch healthcheck passes the required runtime environment variable to localhost curl."
targetRules = ["curl-auth-user"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)live-auction-bid-backend/deploy/prod/docker-compose\.yml$''']
regexes = ['''curl -fsS -u 'elastic:\$\$\{ELASTIC_PASSWORD\}' 'http://127\.0\.0\.1:9200/_cluster/health\?wait_for_status=yellow&timeout=5s' >/dev/null''']

[[allowlists]]
description = "Presentation-freeze manifest values are lowercase SHA-256 content hashes."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)live-auction-user-h5/scripts/presentation-freeze\.manifest\.json$''']
regexes = ['''^\s*"[^"]+":\s*"[a-f0-9]{64}",?\s*$''']
