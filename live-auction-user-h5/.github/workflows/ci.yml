name: h5-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: h5-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check presentation freeze
        run: npm run check:presentation-freeze

      - name: Check contract guardrails
        run: npm run check:contract-guardrails

      - name: Test
        run: npm test

      - name: Check external assets
        run: npm run check:external-assets

      - name: Build
        run: npm run build
