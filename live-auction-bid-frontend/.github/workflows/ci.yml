name: frontend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          path: live-auction-bid-frontend

      - name: Check out backend contracts
        uses: actions/checkout@v6
        with:
          repository: Ye-yellow/auction-backend
          path: live-auction-bid-backend

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live-auction-bid-frontend/package-lock.json

      - name: Install dependencies
        working-directory: live-auction-bid-frontend
        run: npm ci

      - name: Build
        working-directory: live-auction-bid-frontend
        run: npm run build

      - name: Check visual asset lock
        working-directory: live-auction-bid-frontend
        run: npm run check:visual-lock

      - name: Run unit and DOM snapshot tests
        working-directory: live-auction-bid-frontend
        run: npm run test

      - name: Run blocking admin lint
        working-directory: live-auction-bid-frontend
        run: npm run lint:admin

      - name: Check dead code
        working-directory: live-auction-bid-frontend
        run: npm run knip

      - name: Install Playwright Chromium
        working-directory: live-auction-bid-frontend
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: live-auction-bid-frontend
        run: npm run test:visual

      - name: Enforce admin performance budgets
        working-directory: live-auction-bid-frontend
        run: npm run baseline:admin

      - name: Check generated API contract
        working-directory: live-auction-bid-frontend
        shell: bash
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/generated/auction.schema.ts src/shared/realtime/generated/realtime.contract.ts
