global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
  external_labels:
    service: live-auction
    environment: production-compose

rule_files:
  - /etc/prometheus/rules/target-infrastructure.yml

scrape_configs:
  - job_name: auction-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:18080]

  - job_name: auction-service
    metrics_path: /metrics
    static_configs:
      - targets: [auction-service:18086]

  - job_name: outbox-relay
    metrics_path: /metrics
    static_configs:
      - targets: [outbox-relay:18082]

  - job_name: projector
    metrics_path: /metrics
    static_configs:
      - targets: [projector:18083]

  - job_name: domain-relay
    metrics_path: /metrics
    static_configs:
      - targets: [domain-relay:18084]

  - job_name: enrichment-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [enrichment-consumer:18087]

  - job_name: index-pgvector
    metrics_path: /metrics
    static_configs:
      - targets: [index-pgvector:18089]

  - job_name: index-es
    metrics_path: /metrics
    static_configs:
      - targets: [index-es:18088]

  - job_name: search-reconciler
    metrics_path: /metrics
    static_configs:
      - targets: [search-reconciler:18090]

  - job_name: close-worker
    metrics_path: /metrics
    static_configs:
      - targets: [close-worker:18085]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: nats
    static_configs:
      - targets: [nats-exporter:7777]

  - job_name: elasticsearch
    static_configs:
      - targets: [elasticsearch-exporter:9114]

  - job_name: pgvector
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
