server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
jetstream: disabled

cluster {
  name: live-auction-ha
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222,
    nats-route://nats-2:6222,
    nats-route://nats-3:6222
  ]
  connect_retries: 120
}

system_account: SYS

accounts {
  APP {
    users: [
      {
        user: auction-service
        password: $NATS_AUCTION_SERVICE_PASSWORD
        permissions: {
          publish: ["auction.realtime.room.>"]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: domain-relay
        password: $NATS_DOMAIN_RELAY_PASSWORD
        permissions: {
          publish: ["auction.realtime.room.>"]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: gateway
        password: $NATS_GATEWAY_PASSWORD
        permissions: {
          publish: ["auction.realtime.room.>", "_INBOX.>"]
          subscribe: ["auction.realtime.room.>", "_INBOX.>"]
        }
      }
    ]
  },
  SYS {
    users: [
      {
        user: monitor
        password: $NATS_MONITOR_PASSWORD
      }
    ]
  }
}
