server_name: live-auction-nats-local
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
jetstream: disabled

system_account: SYS

accounts {
  APP {
    users: [
      {
        user: auction-service
        password: $NATS_AUCTION_SERVICE_PASSWORD
        permissions: {
          publish: ["auction.realtime.room.>"]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: domain-relay
        password: $NATS_DOMAIN_RELAY_PASSWORD
        permissions: {
          publish: ["auction.realtime.room.>"]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: gateway
        password: $NATS_GATEWAY_PASSWORD
        permissions: {
          # Gateway owns draft/queue management events and subscribes only to
          # rooms held by this WebSocket instance. Runtime commands publish
          # through the separate auction-service account.
          publish: ["auction.realtime.room.>", "_INBOX.>"]
          subscribe: ["auction.realtime.room.>", "_INBOX.>"]
        }
      }
    ]
  },
  SYS {
    users: [
      {
        user: monitor
        password: $NATS_MONITOR_PASSWORD
      }
    ]
  }
}
