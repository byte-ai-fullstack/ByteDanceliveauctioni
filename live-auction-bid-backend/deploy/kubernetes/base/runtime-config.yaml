apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-runtime-config
data:
  AUCTION_ENV: production
  AUCTION_HTTP_ADDR: ":18080"
  AUCTION_GRPC_ADDR: ":19090"
  AUCTION_OPERATIONS_ADDR: ":18086"
  AUCTION_COMMAND_GRPC_TARGET: "dns:///auction-service.live-auction.svc.cluster.local:19090"
  AUCTION_COMMAND_GRPC_TIMEOUT: "3s"
  AUCTION_REDIS_ADDRS: "redis-sentinel-0.redis-sentinel.data.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel.data.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel.data.svc.cluster.local:26379"
  AUCTION_REDIS_MASTER_NAME: "live-auction-primary"
  AUCTION_REDIS_POOL_SIZE: "64"
  AUCTION_REDIS_MIN_IDLE_CONNS: "8"
  AUCTION_OUTBOX_SHARDS: "16"
  AUCTION_OUTBOX_PENDING_LIMIT: "3000"
  AUCTION_PROJECTION_GATE_ENABLED: "true"
  AUCTION_PROJECTION_GATE_REFRESH_INTERVAL: "2s"
  AUCTION_PROJECTION_GATE_REFRESH_TIMEOUT: "1500ms"
  AUCTION_PROJECTION_GATE_MAX_STALENESS: "6s"
  AUCTION_PROJECTION_GATE_MAX_LAG_RECORDS: "1000"
  AUCTION_PROJECTION_GATE_MAX_OLDEST_AGE: "30s"
  AUCTION_PROJECTION_GATE_RUNTIME_TOPIC_RETENTION: "2160h"
  AUCTION_PROJECTION_GATE_MIN_RETENTION_HEADROOM: "168h"
  AUCTION_PROJECTION_GATE_HEALTHY_POLLS_TO_OPEN: "3"
  AUCTION_REDIS_WAIT_REPLICAS: "1"
  AUCTION_REDIS_WAIT_TIMEOUT: "50ms"
  AUCTION_PAYMENT_PROVIDER: "mock"
  AUCTION_JWT_ISSUER: "auction-backend"
  AUCTION_STORAGE_PROVIDER: "tos"
  AUCTION_TOS_USE_SSL: "true"
  AUCTION_WS_ALLOW_MISSING_ORIGIN: "false"
  AUCTION_WS_ALLOWED_ORIGINS: "https://auction.example.invalid"
  AUCTION_WS_TICKET_TTL: "60s"
  AUCTION_WS_DRAIN_TIMEOUT: "75s"
  AUCTION_HTTP_STOP_TIMEOUT: "10s"
  AUCTION_DB_MAX_OPEN_CONNS: "25"
  AUCTION_DB_MAX_IDLE_CONNS: "10"
  AUCTION_DB_CONN_MAX_LIFETIME: "30m"
  AUCTION_DB_CONN_MAX_IDLE_TIME: "2m"
  AUCTION_OUTBOX_RELAY_OPERATIONS_ADDR: ":18082"
  AUCTION_OUTBOX_RELAY_LEASE_TTL: "15s"
  AUCTION_OUTBOX_RELAY_RENEW_INTERVAL: "5s"
  AUCTION_OUTBOX_RELAY_OPERATION_TIMEOUT: "10s"
  AUCTION_OUTBOX_RELAY_RELEASE_TIMEOUT: "2s"
  AUCTION_PROJECTOR_OPERATIONS_ADDR: ":18083"
  AUCTION_PROJECTOR_GROUP_ID: "auction-projector-v1"
  AUCTION_PROJECTOR_MAX_POLL_RECORDS: "500"
  AUCTION_PROJECTOR_DB_MAX_OPEN_CONNS: "5"
  AUCTION_PROJECTOR_DB_MAX_IDLE_CONNS: "2"
  AUCTION_DOMAIN_RELAY_OPERATIONS_ADDR: ":18084"
  AUCTION_DOMAIN_RELAY_CLAIM_LIMIT: "16"
  AUCTION_DOMAIN_RELAY_CONCURRENCY: "16"
  AUCTION_DOMAIN_RELAY_DB_MAX_OPEN_CONNS: "5"
  AUCTION_DOMAIN_RELAY_DB_MAX_IDLE_CONNS: "2"
  AUCTION_ENRICHMENT_OPERATIONS_ADDR: ":18087"
  AUCTION_ENRICHMENT_GROUP_ID: "auction-order-enrichment-v1"
  AUCTION_ENRICHMENT_DB_MAX_OPEN_CONNS: "5"
  AUCTION_ENRICHMENT_DB_MAX_IDLE_CONNS: "2"
  AUCTION_CLOSE_WORKER_OPERATIONS_ADDR: ":18085"
  AUCTION_CLOSE_WORKER_INTERVAL: "250ms"
  AUCTION_CLOSE_WORKER_BATCH_LIMIT: "200"
  AUCTION_CLOSE_WORKER_CONCURRENCY: "8"
  AUCTION_CLOSE_WORKER_OPERATION_TIMEOUT: "2s"
