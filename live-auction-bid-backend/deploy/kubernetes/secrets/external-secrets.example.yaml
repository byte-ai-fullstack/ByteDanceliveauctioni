apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auction-runtime-credentials
  namespace: live-auction
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: auction-runtime-credentials
    creationPolicy: Owner
  data:
    - secretKey: mysql-dsn
      remoteRef: {key: live-auction/production/runtime, property: mysql_dsn}
    - secretKey: redis-password
      remoteRef: {key: live-auction/production/runtime, property: redis_password}
    - secretKey: redis-sentinel-password
      remoteRef: {key: live-auction/production/runtime, property: redis_sentinel_password}
    - secretKey: jwt-secret
      remoteRef: {key: live-auction/production/runtime, property: jwt_secret}
    - secretKey: auction-service-nats-urls
      remoteRef: {key: live-auction/production/runtime, property: auction_service_nats_urls}
    - secretKey: gateway-nats-urls
      remoteRef: {key: live-auction/production/runtime, property: gateway_nats_urls}
    - secretKey: domain-relay-nats-urls
      remoteRef: {key: live-auction/production/runtime, property: domain_relay_nats_urls}
    - secretKey: tos-endpoint
      remoteRef: {key: live-auction/production/storage, property: tos_endpoint}
    - secretKey: tos-region
      remoteRef: {key: live-auction/production/storage, property: tos_region}
    - secretKey: tos-bucket
      remoteRef: {key: live-auction/production/storage, property: tos_bucket}
    - secretKey: tos-access-key
      remoteRef: {key: live-auction/production/storage, property: tos_access_key}
    - secretKey: tos-secret-key
      remoteRef: {key: live-auction/production/storage, property: tos_secret_key}
---
