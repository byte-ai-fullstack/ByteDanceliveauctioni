apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: index-es}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: index-es}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: index-pgvector}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: index-pgvector}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-search-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/tier: search-worker}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {live-auction.io/observability-access: "true"}}
      ports:
        - {protocol: TCP, port: 18088}
        - {protocol: TCP, port: 18089}
        - {protocol: TCP, port: 18090}
