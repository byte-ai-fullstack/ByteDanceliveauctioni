apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: AUCTION_SEARCH_ES_URL
              valueFrom: {secretKeyRef: {name: auction-search-credentials, key: elasticsearch-url}}
            - name: AUCTION_SEARCH_ES_USERNAME
              valueFrom: {secretKeyRef: {name: auction-search-credentials, key: elasticsearch-username}}
            - name: AUCTION_SEARCH_ES_PASSWORD
              valueFrom: {secretKeyRef: {name: auction-search-credentials, key: elasticsearch-password}}
            - name: AUCTION_SEARCH_PG_DSN
              valueFrom: {secretKeyRef: {name: auction-search-credentials, key: pgvector-dsn}}
            - name: AUCTION_EMBEDDING_API_KEY
              valueFrom: {secretKeyRef: {name: auction-search-credentials, key: embedding-api-key}}
