    environment:
      MYSQLD_EXPORTER_PASSWORD: "${AUCTION_MYSQL_EXPORTER_PASSWORD:?AUCTION_MYSQL_EXPORTER_PASSWORD is required}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - live-auction

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1@sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
    container_name: live-auction-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - live-auction

  prometheus:
    image: prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6
    container_name: live-auction-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./backend/deploy/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/deploy/prometheus/rules:/etc/prometheus/rules:ro
      - live-auction-prometheus:/prometheus
    depends_on:
      auction-backend:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      outbox-relay:
        condition: service_healthy
      projector:
        condition: service_healthy
      domain-relay:
        condition: service_healthy
      enrichment-consumer:
        condition: service_healthy
      close-worker:
        condition: service_healthy
    networks:
      - live-auction

  grafana:
    image: grafana/grafana:11.1.4@sha256:886b56d5534e54f69a8cfcb4b8928da8fc753178a7a3d20c3f9b04b660169805
    container_name: live-auction-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_DEFAULT_THEME: "light"
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./backend/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - live-auction-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - live-auction

volumes:
  live-auction-mysql:
  live-auction-redis:
  live-auction-pgvector:
  live-auction-elasticsearch:
  live-auction-prometheus:
  live-auction-grafana:

networks:
  live-auction:
    driver: bridge
