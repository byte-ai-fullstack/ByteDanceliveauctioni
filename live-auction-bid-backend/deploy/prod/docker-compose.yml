  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    container_name: live-auction-kafka-exporter
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -- "--kafka.server=$${AUCTION_KAFKA_EXPORTER_BROKER}"
        case "$${AUCTION_KAFKA_EXPORTER_SECURITY_PROTOCOL}" in
          PLAINTEXT) ;;
          SSL) set -- "$$@" --tls.enabled ;;
          SASL_PLAINTEXT|SASL_SSL)
            mechanism="$$(printf '%s' "$${AUCTION_KAFKA_EXPORTER_SASL_MECHANISM}" | tr '[:upper:]_' '[:lower:]-')"
            case "$$mechanism" in
              scram-sha-256) mechanism=sha256 ;;
              scram-sha-512) mechanism=sha512 ;;
              plain) mechanism=plain ;;
              *) echo "unsupported Kafka exporter SASL mechanism: $$mechanism" >&2; exit 2 ;;
            esac
            set -- "$$@" --sasl.enabled "--sasl.mechanism=$$mechanism" \
              "--sasl.username=$${AUCTION_KAFKA_EXPORTER_SASL_USERNAME}" \
              "--sasl.password=$${AUCTION_KAFKA_EXPORTER_SASL_PASSWORD}"
            if [ "$${AUCTION_KAFKA_EXPORTER_SECURITY_PROTOCOL}" = SASL_SSL ]; then set -- "$$@" --tls.enabled; fi
            ;;
          *) echo "unsupported Kafka exporter security protocol" >&2; exit 2 ;;
        esac
        if [ -n "$${AUCTION_KAFKA_EXPORTER_TLS_SERVER_NAME}" ]; then
          set -- "$$@" "--tls.server-name=$${AUCTION_KAFKA_EXPORTER_TLS_SERVER_NAME}"
        fi
        if [ -n "$${AUCTION_KAFKA_EXPORTER_TLS_CA_FILE}" ]; then
          set -- "$$@" "--tls.ca-file=$${AUCTION_KAFKA_EXPORTER_TLS_CA_FILE}"
        fi
        if [ "$${AUCTION_KAFKA_EXPORTER_TLS_INSECURE_SKIP_VERIFY}" = true ]; then
          set -- "$$@" --tls.insecure-skip-tls-verify
        fi
        exec /bin/kafka_exporter "$$@"
    environment:
      AUCTION_KAFKA_EXPORTER_BROKER: "${AUCTION_KAFKA_EXPORTER_BROKER:-${AUCTION_KAFKA_BROKERS}}"
      AUCTION_KAFKA_EXPORTER_SECURITY_PROTOCOL: "${AUCTION_KAFKA_EXPORTER_SECURITY_PROTOCOL:-${AUCTION_KAFKA_SECURITY_PROTOCOL}}"
      AUCTION_KAFKA_EXPORTER_SASL_MECHANISM: "${AUCTION_KAFKA_EXPORTER_SASL_MECHANISM:-${AUCTION_KAFKA_SASL_MECHANISM:-PLAIN}}"
      AUCTION_KAFKA_EXPORTER_SASL_USERNAME: "${AUCTION_KAFKA_EXPORTER_SASL_USERNAME:-${AUCTION_KAFKA_SASL_USERNAME:-}}"
      AUCTION_KAFKA_EXPORTER_SASL_PASSWORD: "${AUCTION_KAFKA_EXPORTER_SASL_PASSWORD:-${AUCTION_KAFKA_SASL_PASSWORD:-}}"
      AUCTION_KAFKA_EXPORTER_TLS_SERVER_NAME: "${AUCTION_KAFKA_EXPORTER_TLS_SERVER_NAME:-${AUCTION_KAFKA_TLS_SERVER_NAME:-}}"
      AUCTION_KAFKA_EXPORTER_TLS_CA_FILE: "${AUCTION_KAFKA_EXPORTER_TLS_CA_FILE:-${AUCTION_KAFKA_TLS_CA_FILE:-}}"
      AUCTION_KAFKA_EXPORTER_TLS_INSECURE_SKIP_VERIFY: "${AUCTION_KAFKA_EXPORTER_TLS_INSECURE_SKIP_VERIFY:-false}"
    networks:
