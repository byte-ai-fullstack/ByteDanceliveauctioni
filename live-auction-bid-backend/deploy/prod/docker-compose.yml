x-kafka-client-env: &kafka-client-env
  AUCTION_KAFKA_CLIENT_PROPERTIES_FILE: "${AUCTION_KAFKA_CLIENT_PROPERTIES_FILE:-}"
  AUCTION_KAFKA_BROKERS: "${AUCTION_KAFKA_BROKERS:?AUCTION_KAFKA_BROKERS is required}"
  AUCTION_KAFKA_SECURITY_PROTOCOL: "${AUCTION_KAFKA_SECURITY_PROTOCOL:?AUCTION_KAFKA_SECURITY_PROTOCOL is required}"
  AUCTION_KAFKA_SASL_MECHANISM: "${AUCTION_KAFKA_SASL_MECHANISM:-}"
  AUCTION_KAFKA_SASL_USERNAME: "${AUCTION_KAFKA_SASL_USERNAME:-}"
  AUCTION_KAFKA_SASL_PASSWORD: "${AUCTION_KAFKA_SASL_PASSWORD:-}"
  AUCTION_KAFKA_TLS_CA_FILE: "${AUCTION_KAFKA_TLS_CA_FILE:-}"
  AUCTION_KAFKA_TLS_SERVER_NAME: "${AUCTION_KAFKA_TLS_SERVER_NAME:-}"

services:
  migrate:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    entrypoint: ["/app/auction-migrate"]
    command: ["up"]
    env_file:
      - "${LIVE_AUCTION_ENV_FILE:-/opt/live-auction/.env}"
    environment:
      AUCTION_MYSQL_DSN: "auction:${AUCTION_MYSQL_PASSWORD:?AUCTION_MYSQL_PASSWORD is required}@tcp(mysql:3306)/live_auction?parseTime=true&charset=utf8mb4&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - live-auction

  auction-backend:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    entrypoint: ["/app/auction-gateway"]
    container_name: live-auction-bid-backend
    restart: unless-stopped
    env_file:
      - "${LIVE_AUCTION_ENV_FILE:-/opt/live-auction/.env}"
    environment:
      AUCTION_HTTP_ADDR: ":18080"
      AUCTION_COMMAND_GRPC_TARGET: "dns:///auction-service:19090"
      AUCTION_COMMAND_GRPC_TIMEOUT: "${AUCTION_COMMAND_GRPC_TIMEOUT:-3s}"
      AUCTION_ENV: "${AUCTION_ENV:-prod}"
      AUCTION_WS_ALLOWED_ORIGINS: "${AUCTION_WS_ALLOWED_ORIGINS:?AUCTION_WS_ALLOWED_ORIGINS is required}"
      AUCTION_WS_ALLOW_MISSING_ORIGIN: "${AUCTION_WS_ALLOW_MISSING_ORIGIN:-false}"
      AUCTION_WS_TICKET_TTL: "${AUCTION_WS_TICKET_TTL:-60s}"
      AUCTION_MYSQL_DSN: "auction:${AUCTION_MYSQL_PASSWORD:?AUCTION_MYSQL_PASSWORD is required}@tcp(mysql:3306)/live_auction?parseTime=true&charset=utf8mb4&loc=Local"
      AUCTION_REDIS_ADDR: "redis:6379"
      AUCTION_REDIS_PASSWORD: "${AUCTION_REDIS_PASSWORD:?AUCTION_REDIS_PASSWORD is required}"
      AUCTION_SEARCH_PROVIDER: "${AUCTION_SEARCH_PROVIDER:-}"
      AUCTION_SEARCH_PG_DSN: "${AUCTION_SEARCH_PG_DSN:-}"
      AUCTION_SEARCH_ES_URL: "${AUCTION_SEARCH_ES_URL:-}"
      AUCTION_SEARCH_ES_USERNAME: "${AUCTION_SEARCH_ES_USERNAME:-}"
      AUCTION_SEARCH_ES_PASSWORD: "${AUCTION_SEARCH_ES_PASSWORD:-}"
      AUCTION_SEARCH_ES_ALIAS: "${AUCTION_SEARCH_ES_ALIAS:-auction-lots-current}"
      AUCTION_SEARCH_ES_TIMEOUT: "${AUCTION_SEARCH_ES_TIMEOUT:-3s}"
      AUCTION_SEARCH_ES_MAX_RESPONSE_BYTES: "${AUCTION_SEARCH_ES_MAX_RESPONSE_BYTES:-1048576}"
      AUCTION_SEARCH_QUERY_TIMEOUT: "${AUCTION_SEARCH_QUERY_TIMEOUT:-5s}"
      AUCTION_EMBEDDING_PROVIDER: "${AUCTION_EMBEDDING_PROVIDER:-dashscope}"
      AUCTION_EMBEDDING_BASE_URL: "${AUCTION_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      AUCTION_EMBEDDING_MODEL: "${AUCTION_EMBEDDING_MODEL:-text-embedding-v4}"
      AUCTION_EMBEDDING_MODEL_VERSION: "${AUCTION_EMBEDDING_MODEL_VERSION:-text-embedding-v4}"
      AUCTION_EMBEDDING_DIMENSIONS: "${AUCTION_EMBEDDING_DIMENSIONS:-1024}"
      AUCTION_EMBEDDING_BATCH_SIZE: "${AUCTION_EMBEDDING_BATCH_SIZE:-10}"
      AUCTION_EMBEDDING_TIMEOUT: "${AUCTION_EMBEDDING_TIMEOUT:-8s}"
      AUCTION_EMBEDDING_COST_PER_MILLION_TOKENS: "${AUCTION_EMBEDDING_COST_PER_MILLION_TOKENS:-0}"
      AUCTION_EMBEDDING_API_KEY: "${AUCTION_EMBEDDING_API_KEY:-}"
      AUCTION_AI_PROVIDER: "${AUCTION_AI_PROVIDER:-mock}"
      AUCTION_AI_BASE_URL: "${AUCTION_AI_BASE_URL:-}"
      AUCTION_AI_MODEL: "${AUCTION_AI_MODEL:-}"
      AUCTION_AI_TIMEOUT: "${AUCTION_AI_TIMEOUT:-8s}"
      AUCTION_AI_MOCK_ON_FAILURE: "${AUCTION_AI_MOCK_ON_FAILURE:-true}"
      AUCTION_AI_API_KEY: "${AUCTION_AI_API_KEY:-}"
      AUCTION_PAYMENT_PROVIDER: "${AUCTION_PAYMENT_PROVIDER:?AUCTION_PAYMENT_PROVIDER is required}"
      AUCTION_JWT_SECRET: "${AUCTION_JWT_SECRET:?AUCTION_JWT_SECRET is required}"
      AUCTION_JWT_ISSUER: "auction-backend"
      AUCTION_BOOTSTRAP_MAIN_ACCOUNT_USERNAME: "${AUCTION_BOOTSTRAP_MAIN_ACCOUNT_USERNAME:-main}"
      AUCTION_BOOTSTRAP_MAIN_ACCOUNT_PASSWORD: "${AUCTION_BOOTSTRAP_MAIN_ACCOUNT_PASSWORD:?AUCTION_BOOTSTRAP_MAIN_ACCOUNT_PASSWORD is required}"
      AUCTION_BOOTSTRAP_MAIN_ACCOUNT_NICKNAME: "${AUCTION_BOOTSTRAP_MAIN_ACCOUNT_NICKNAME:-主账号}"
      AUCTION_VERBOSE_BID_LOG: "${AUCTION_VERBOSE_BID_LOG:-false}"
      AUCTION_NATS_URLS: "${AUCTION_GATEWAY_NATS_URLS:-${AUCTION_NATS_URLS:?AUCTION_NATS_URLS is required}}"
      AUCTION_NATS_CLIENT_NAME: "${AUCTION_NATS_CLIENT_NAME:-live-auction-prod-gateway}"
      AUCTION_OUTBOX_SHARDS: "16"
      AUCTION_OUTBOX_PENDING_LIMIT: "${AUCTION_OUTBOX_PENDING_LIMIT:-3000}"
      AUCTION_DB_MAX_OPEN_CONNS: "${AUCTION_DB_MAX_OPEN_CONNS:-30}"
      AUCTION_DB_MAX_IDLE_CONNS: "${AUCTION_DB_MAX_IDLE_CONNS:-15}"
      AUCTION_DB_CONN_MAX_LIFETIME: "${AUCTION_DB_CONN_MAX_LIFETIME:-30m}"
      AUCTION_DB_CONN_MAX_IDLE_TIME: "${AUCTION_DB_CONN_MAX_IDLE_TIME:-2m}"
      AUCTION_REDIS_POOL_SIZE: "${AUCTION_REDIS_POOL_SIZE:-128}"
      AUCTION_REDIS_MIN_IDLE_CONNS: "${AUCTION_REDIS_MIN_IDLE_CONNS:-16}"
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      auction-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      live-auction:
        aliases:
          - gateway

  auction-service:
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    container_name: live-auction-auction-service
    restart: unless-stopped
    entrypoint: ["/app/auction-service"]
    env_file:
      - "${LIVE_AUCTION_ENV_FILE:-/opt/live-auction/.env}"
    environment:
      <<: *kafka-client-env
      AUCTION_INSTANCE_ID: "auction-service-prod"
      AUCTION_ENV: "${AUCTION_ENV:-prod}"
      AUCTION_GRPC_ADDR: ":19090"
      AUCTION_OPERATIONS_ADDR: ":18086"
      AUCTION_MYSQL_DSN: "auction:${AUCTION_MYSQL_PASSWORD:?AUCTION_MYSQL_PASSWORD is required}@tcp(mysql:3306)/live_auction?parseTime=true&charset=utf8mb4&loc=Local"
      AUCTION_REDIS_ADDR: "redis:6379"
      AUCTION_REDIS_PASSWORD: "${AUCTION_REDIS_PASSWORD:?AUCTION_REDIS_PASSWORD is required}"
      AUCTION_NATS_URLS: "${AUCTION_SERVICE_NATS_URLS:-${AUCTION_NATS_URLS:?AUCTION_NATS_URLS is required}}"
      AUCTION_NATS_CLIENT_NAME: "live-auction-prod-auction-service"
      AUCTION_JWT_SECRET: "${AUCTION_JWT_SECRET:?AUCTION_JWT_SECRET is required}"
      AUCTION_JWT_ISSUER: "auction-backend"
      AUCTION_PAYMENT_PROVIDER: "${AUCTION_PAYMENT_PROVIDER:?AUCTION_PAYMENT_PROVIDER is required}"
      AUCTION_VERBOSE_BID_LOG: "${AUCTION_VERBOSE_BID_LOG:-false}"
      AUCTION_OUTBOX_SHARDS: "16"
      AUCTION_OUTBOX_PENDING_LIMIT: "${AUCTION_OUTBOX_PENDING_LIMIT:-3000}"
      AUCTION_RUNTIME_GENERATION_GUARD_ENABLED: "${AUCTION_RUNTIME_GENERATION_GUARD_ENABLED:-true}"
      AUCTION_RUNTIME_GENERATION_POLL_INTERVAL: "${AUCTION_RUNTIME_GENERATION_POLL_INTERVAL:-1s}"
      AUCTION_RUNTIME_RECONCILE_INTERVAL: "${AUCTION_RUNTIME_RECONCILE_INTERVAL:-30s}"
      AUCTION_PROJECTION_GATE_ENABLED: "true"
      AUCTION_PROJECTION_GATE_REFRESH_INTERVAL: "${AUCTION_PROJECTION_GATE_REFRESH_INTERVAL:-2s}"
      AUCTION_PROJECTION_GATE_REFRESH_TIMEOUT: "${AUCTION_PROJECTION_GATE_REFRESH_TIMEOUT:-1500ms}"
      AUCTION_PROJECTION_GATE_MAX_STALENESS: "${AUCTION_PROJECTION_GATE_MAX_STALENESS:-6s}"
      AUCTION_PROJECTION_GATE_MAX_LAG_RECORDS: "${AUCTION_PROJECTION_GATE_MAX_LAG_RECORDS:-1000}"
      AUCTION_PROJECTION_GATE_MAX_OLDEST_AGE: "${AUCTION_PROJECTION_GATE_MAX_OLDEST_AGE:-30s}"
      AUCTION_PROJECTION_GATE_RUNTIME_TOPIC_RETENTION: "${AUCTION_PROJECTION_GATE_RUNTIME_TOPIC_RETENTION:-2160h}"
      AUCTION_PROJECTION_GATE_MIN_RETENTION_HEADROOM: "${AUCTION_PROJECTION_GATE_MIN_RETENTION_HEADROOM:-168h}"
      AUCTION_PROJECTION_GATE_HEALTHY_POLLS_TO_OPEN: "${AUCTION_PROJECTION_GATE_HEALTHY_POLLS_TO_OPEN:-3}"
      AUCTION_KAFKA_CLIENT_ID: "auction-service-projection-gate-prod"
      AUCTION_DB_MAX_OPEN_CONNS: "${AUCTION_DB_MAX_OPEN_CONNS:-30}"
      AUCTION_DB_MAX_IDLE_CONNS: "${AUCTION_DB_MAX_IDLE_CONNS:-15}"
      AUCTION_DB_CONN_MAX_LIFETIME: "${AUCTION_DB_CONN_MAX_LIFETIME:-30m}"
      AUCTION_DB_CONN_MAX_IDLE_TIME: "${AUCTION_DB_CONN_MAX_IDLE_TIME:-2m}"
      AUCTION_REDIS_POOL_SIZE: "${AUCTION_REDIS_POOL_SIZE:-128}"
      AUCTION_REDIS_MIN_IDLE_CONNS: "${AUCTION_REDIS_MIN_IDLE_CONNS:-16}"
    expose:
      - "19090"
    ports:
      - "127.0.0.1:18086:18086"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18086/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - live-auction

  outbox-relay:
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    container_name: live-auction-outbox-relay
    restart: unless-stopped
    entrypoint: ["/app/auction-outbox-relay"]
    env_file:
      - "${LIVE_AUCTION_ENV_FILE:-/opt/live-auction/.env}"
    environment:
      <<: *kafka-client-env
      AUCTION_INSTANCE_ID: "outbox-relay-prod"
      AUCTION_KAFKA_CLIENT_ID: "auction-outbox-relay-prod"
      AUCTION_REDIS_ADDR: "redis:6379"
      AUCTION_REDIS_PASSWORD: "${AUCTION_REDIS_PASSWORD:?AUCTION_REDIS_PASSWORD is required}"
      AUCTION_OUTBOX_RELAY_OPERATIONS_ADDR: ":18082"
      AUCTION_OUTBOX_SHARDS: "16"
      AUCTION_OUTBOX_RELAY_LEASE_TTL: "${AUCTION_OUTBOX_RELAY_LEASE_TTL:-15s}"
      AUCTION_OUTBOX_RELAY_RENEW_INTERVAL: "${AUCTION_OUTBOX_RELAY_RENEW_INTERVAL:-5s}"
      AUCTION_OUTBOX_RELAY_OPERATION_TIMEOUT: "${AUCTION_OUTBOX_RELAY_OPERATION_TIMEOUT:-10s}"
      AUCTION_OUTBOX_RELAY_RELEASE_TIMEOUT: "${AUCTION_OUTBOX_RELAY_RELEASE_TIMEOUT:-2s}"
    ports:
      - "127.0.0.1:18082:18082"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18082/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - live-auction

  projector:
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    container_name: live-auction-projector
    restart: unless-stopped
    entrypoint: ["/app/auction-projector"]
    env_file:
      - "${LIVE_AUCTION_ENV_FILE:-/opt/live-auction/.env}"
    environment:
