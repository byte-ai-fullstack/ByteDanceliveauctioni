      AUCTION_INSTANCE_ID: "projector-prod"
      AUCTION_KAFKA_CLIENT_ID: "auction-projector-prod"
      AUCTION_MYSQL_DSN: "auction:${AUCTION_MYSQL_PASSWORD:?AUCTION_MYSQL_PASSWORD is required}@tcp(mysql:3306)/live_auction?parseTime=true&charset=utf8mb4&loc=Local"
      AUCTION_PROJECTOR_GROUP_ID: "${AUCTION_PROJECTOR_GROUP_ID:-auction-projector-v1}"
      AUCTION_PROJECTOR_OPERATIONS_ADDR: ":18083"
      AUCTION_PROJECTOR_MAX_POLL_RECORDS: "${AUCTION_PROJECTOR_MAX_POLL_RECORDS:-500}"
      AUCTION_PROJECTOR_SESSION_TIMEOUT: "${AUCTION_PROJECTOR_SESSION_TIMEOUT:-30s}"
      AUCTION_PROJECTOR_HEARTBEAT_INTERVAL: "${AUCTION_PROJECTOR_HEARTBEAT_INTERVAL:-3s}"
      AUCTION_PROJECTOR_RETRY_ATTEMPTS: "${AUCTION_PROJECTOR_RETRY_ATTEMPTS:-5}"
      AUCTION_PROJECTOR_RETRY_BASE_DELAY: "${AUCTION_PROJECTOR_RETRY_BASE_DELAY:-20ms}"
      AUCTION_PROJECTOR_RETRY_MAX_DELAY: "${AUCTION_PROJECTOR_RETRY_MAX_DELAY:-1s}"
      AUCTION_PROJECTOR_DB_MAX_OPEN_CONNS: "${AUCTION_PROJECTOR_DB_MAX_OPEN_CONNS:-12}"
      AUCTION_PROJECTOR_DB_MAX_IDLE_CONNS: "${AUCTION_PROJECTOR_DB_MAX_IDLE_CONNS:-6}"
      AUCTION_PROJECTOR_DB_CONN_MAX_LIFETIME: "${AUCTION_PROJECTOR_DB_CONN_MAX_LIFETIME:-30m}"
      AUCTION_PROJECTOR_DB_CONN_MAX_IDLE_TIME: "${AUCTION_PROJECTOR_DB_CONN_MAX_IDLE_TIME:-2m}"
    ports:
      - "127.0.0.1:18083:18083"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18083/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - live-auction

  domain-relay:
    image: "${LIVE_AUCTION_BACKEND_IMAGE:?LIVE_AUCTION_BACKEND_IMAGE is required}"
    container_name: live-auction-domain-relay
    restart: unless-stopped
    entrypoint: ["/app/auction-domain-relay"]
