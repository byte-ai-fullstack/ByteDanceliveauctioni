bind 0.0.0.0
protected-mode no
port 26379
dir /data

# This credential is deliberately scoped to the disposable HA lab.
sentinel monitor live-auction redis-primary 6379 2
sentinel auth-pass live-auction redis-ha-test-only
sentinel down-after-milliseconds live-auction 5000
sentinel failover-timeout live-auction 60000
sentinel parallel-syncs live-auction 1
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
