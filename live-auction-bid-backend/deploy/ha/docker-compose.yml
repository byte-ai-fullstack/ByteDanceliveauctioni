x-kafka-common: &kafka-common
  image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 20
    start_period: 30s
  networks: [live-auction-ha]

x-kafka-environment: &kafka-environment
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
  KAFKA_LISTENERS: CONTROLLER://:9093,BROKER://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-redis-common: &redis-common
  image: redis:7.2.4-alpine@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
  restart: unless-stopped
  environment:
    REDIS_PASSWORD: redis-ha-test-only
  volumes:
    - ../redis/ha.conf:/etc/redis/redis.conf:ro
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks: [live-auction-ha]

x-sentinel-common: &sentinel-common
  image: redis:7.2.4-alpine@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
  restart: unless-stopped
  command: ["sh", "-c", "cp /etc/redis/sentinel.conf /data/sentinel.conf && exec redis-server /data/sentinel.conf --sentinel"]
  volumes:
    - ../redis/sentinel.ha.conf:/etc/redis/sentinel.conf:ro
  tmpfs:
    - /data
  depends_on:
    redis-primary:
      condition: service_healthy
    redis-replica-1:
      condition: service_healthy
    redis-replica-2:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks: [live-auction-ha]

x-nats-common: &nats-common
  image: nats:2.12.7-alpine@sha256:e602ceca19bddc3dd7197b4b1afde53a16cd9d31a5500a8ae5620f36cb01963c
  restart: unless-stopped
  command: ["-c", "/etc/nats/nats.conf"]
  environment:
    NATS_AUCTION_SERVICE_PASSWORD: auction-service-ha-test-only
    NATS_DOMAIN_RELAY_PASSWORD: domain-relay-ha-test-only
    NATS_GATEWAY_PASSWORD: gateway-ha-test-only
    NATS_MONITOR_PASSWORD: monitor-ha-test-only
  volumes:
    - ../nats/ha.conf:/etc/nats/nats.conf:ro
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks: [live-auction-ha]

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    command: ["/bin/bash", "/opt/auction/kafka-init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - ../../scripts/kafka-init-topics.sh:/opt/auction/kafka-init-topics.sh:ro
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    restart: "no"
    networks: [live-auction-ha]

  redis-primary:
    <<: *redis-common
    hostname: redis-primary
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\" --masterauth \"$${REDIS_PASSWORD}\""]
    volumes:
      - ../redis/ha.conf:/etc/redis/redis.conf:ro
      - redis-primary-data:/data

  redis-replica-1:
    <<: *redis-common
    hostname: redis-replica-1
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\" --masterauth \"$${REDIS_PASSWORD}\" --replicaof redis-primary 6379"]
    volumes:
      - ../redis/ha.conf:/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data

  redis-replica-2:
    <<: *redis-common
    hostname: redis-replica-2
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\" --masterauth \"$${REDIS_PASSWORD}\" --replicaof redis-primary 6379"]
    volumes:
      - ../redis/ha.conf:/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data

  sentinel-1:
    <<: *sentinel-common
    hostname: sentinel-1

  sentinel-2:
    <<: *sentinel-common
    hostname: sentinel-2

  sentinel-3:
    <<: *sentinel-common
    hostname: sentinel-3

  nats-1:
    <<: *nats-common
    hostname: nats-1
    environment:
      NATS_SERVER_NAME: nats-1
      NATS_AUCTION_SERVICE_PASSWORD: auction-service-ha-test-only
      NATS_DOMAIN_RELAY_PASSWORD: domain-relay-ha-test-only
      NATS_GATEWAY_PASSWORD: gateway-ha-test-only
      NATS_MONITOR_PASSWORD: monitor-ha-test-only

  nats-2:
    <<: *nats-common
    hostname: nats-2
    environment:
      NATS_SERVER_NAME: nats-2
      NATS_AUCTION_SERVICE_PASSWORD: auction-service-ha-test-only
      NATS_DOMAIN_RELAY_PASSWORD: domain-relay-ha-test-only
      NATS_GATEWAY_PASSWORD: gateway-ha-test-only
      NATS_MONITOR_PASSWORD: monitor-ha-test-only

  nats-3:
    <<: *nats-common
    hostname: nats-3
    environment:
      NATS_SERVER_NAME: nats-3
      NATS_AUCTION_SERVICE_PASSWORD: auction-service-ha-test-only
      NATS_DOMAIN_RELAY_PASSWORD: domain-relay-ha-test-only
      NATS_GATEWAY_PASSWORD: gateway-ha-test-only
      NATS_MONITOR_PASSWORD: monitor-ha-test-only

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-primary-data:
  redis-replica-1-data:
  redis-replica-2-data:

networks:
  live-auction-ha:
    driver: bridge
