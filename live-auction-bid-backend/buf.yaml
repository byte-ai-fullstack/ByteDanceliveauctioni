version: v2
modules:
  - path: api
  - path: third_party
lint:
  use:
    - STANDARD
  # Existing public RPCs intentionally use Reply suffixes and share a few
  # request/response messages. Renaming them would break released clients.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore:
    - third_party
breaking:
  use:
    - FILE
